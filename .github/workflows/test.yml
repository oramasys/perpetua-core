name: tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev,test-agate-compat]'
      - name: Test with coverage
        run: python -m pytest --cov=perpetua_core --cov-report=term-missing --cov-fail-under=80
      - name: Compile smoke
        run: python -m compileall -q src/perpetua_core
