[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "perpetua-core"
version = "2.0.0-alpha.1"
description = "Hardware-aware local-first LLM orchestration kernel"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "aiosqlite>=0.19",
    "openai>=1.0",
    "oramasys-telos @ git+https://github.com/oramasys/telos.git@b2143083044496d93be3ca2dc88c28135e034d9f",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=6.0",
    "hypothesis>=6.0",
]
# Opt-in only, for exercising perpetua_core.policy.HardwarePolicyResolver's
# real delegation to a live agate.PolicyStore. Deliberately not part of
# dependencies or dev: this package declares no dependency, runtime or
# dev, on agate -- Core never imports upward into the policy authority.
# A legacy caller who actually constructs HardwarePolicyResolver installs
# this (or oramasys-agate directly) themselves; without it, from_file()
# raises a clear ImportError naming the migration path instead of failing
# opaquely. Named distinctly from dev, not folded into it, so `pip install
# -e .[dev]` alone continues to prove Core has no such dependency.
test-agate-compat = [
    "oramasys-agate @ git+https://github.com/oramasys/agate.git@41a0da9d52e0131049a1469234ac56f6990fc635",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["src/tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/perpetua_core"]

[tool.hatch.metadata]
allow-direct-references = true
